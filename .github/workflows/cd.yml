name: CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  id-token: write  
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: packages     

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
